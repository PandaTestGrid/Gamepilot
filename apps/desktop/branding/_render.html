const svgUrl = (s) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

function toBmp(bytes, w, h) {
  const rowSize = ((w * 3 + 3) >> 2) << 2;
  const pixelSize = rowSize * h;
  const buf = new Uint8Array(54 + pixelSize);
  const dv = new DataView(buf.buffer);
  buf[0] = 0x42; buf[1] = 0x4d;                       // BM
  dv.setUint32(2, 54 + pixelSize, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);                          // BITMAPINFOHEADER
  dv.setInt32(18, w, true); dv.setInt32(22, h, true);
  dv.setUint16(26, 1, true); dv.setUint16(28, 24, true);
  dv.setUint32(34, pixelSize, true);
  dv.setInt32(38, 2835, true); dv.setInt32(42, 2835, true);
  for (let y = 0; y < h; y++) {
    const src = (h - 1 - y) * w * 4;                   // bottom-up
    const dst = 54 + y * rowSize;
    for (let x = 0; x < w; x++) {
      buf[dst + x * 3 + 0] = bytes[src + x * 4 + 2];   // B
      buf[dst + x * 3 + 1] = bytes[src + x * 4 + 1];   // G
      buf[dst + x * 3 + 2] = bytes[src + x * 4 + 0];   // R
    }
  }
  let s = ''; for (const b of buf) s += String.fromCharCode(b);
  return btoa(s);
}

async function render(svg, w, h, png) {
  const img = new Image();
  img.src = svgUrl(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  return png ? c.toDataURL('image/png').split(',')[1] : toBmp(data, w, h);
}

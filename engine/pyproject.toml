[project]
name = "gamepilot-engine"
version = "0.0.1"
description = "GamePilot 引擎：感知 + 决策 + 执行 + 事件（不含任何 UI 逻辑）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  # 安卓连接与控制（发现 / 截图 / 输入）。MIT 许可，纯 Python 调用 adb
  "adbutils>=2.0",
  # scrcpy 视频通道的 H.264 解码（BSD-3）。有它才能走 30fps 的投屏通道
  "av>=12",
  # iOS 切 USB 配置（config2）用：小、纯 Python，libusb 在 macOS 自带
  "pyusb>=1.2",
  "pyobjc-framework-quartz>=12.2.2",
  "pyobjc-framework-applicationservices>=12.2.2",
]

[project.optional-dependencies]
# iOS 控制（QuickTime 采集 + CoreDevice HID，需要 iOS 17.4+）
ios = ["pymobiledevice3>=10"]
# OCR 识别器是可选能力：装了 rapidocr 才出现 ocr 类型识别器
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
gamepilot-engine = "gamepilot.rpc.stdio:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepilot"]

# --------------------------------------------------------------------------- #
# ruff：格式化 + lint（与前端 Prettier/ESLint 对齐的风格基线）
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # 行长交给 formatter
  "RUF001",  # 中文注释里的全角标点
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["gamepilot"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy：src 严格，tests 放宽
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
show_error_codes = true

# pymobiledevice3 是**可选**依赖（iOS 控制用）：本机装了 brew 版就能直接跑，
# 没装时 iOS 那一路会给出明确提示，其它平台不受影响
[[tool.mypy.overrides]]
module = ["pymobiledevice3.*", "usb.*", "Quartz.*", "AppKit.*", "ApplicationServices.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# adbutils / av / rapidocr 都没有 py.typed：不为第三方缺失的类型信息买单
[[tool.mypy.overrides]]
module = ["adbutils", "adbutils.*", "av", "av.*", "rapidocr_onnxruntime", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["gamepilot"]

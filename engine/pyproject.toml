[project]
name = "gamepilot-engine"
version = "0.0.1"
description = "GamePilot 引擎：感知 + 决策 + 执行 + 事件（不含任何 UI 逻辑）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  # 5.x 在 Py3.13/Windows 上曾出现只装 dist-info、无 cv2 的坏包；先钉在 4.x
  "opencv-python-headless>=4.9,<5",
  "pillow>=10",
  # 安卓连接与控制（发现 / 截图 / 输入）。MIT 许可，纯 Python 调用 adb
  "adbutils>=2.0",
  # scrcpy 视频通道的 H.264 解码（BSD-3）。有它才能走 30fps 的投屏通道
  "av>=12",
  # iOS 切 USB 配置（config2）用：小、纯 Python，libusb 在 macOS 自带
  "pyusb>=1.2",
  # macOS 本机窗口的截图/输入（Quartz / ApplicationServices），仅 macOS 需要
  "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-applicationservices>=12.2.2; sys_platform == 'darwin'",
  # iOS ≥17.4：RSD 隧道 + DVT 截图 + HID（与 Android 同为标配依赖）
  "pymobiledevice3>=10",
]

[project.optional-dependencies]
# OCR 识别器是可选能力：装了 rapidocr 才出现 ocr 类型识别器
ocr = ["rapidocr-onnxruntime>=1.3"]
# Windows Graphics Capture 抓图通道（官方 WGC；MIT）。Windows 上装了它，窗口设备
# 的 auto 抓图会优先走 WGC：GPU/D3D 窗口、被遮挡窗口都能抓，帧率更高。
# 注意：它依赖 opencv-python（不是 headless）；打包/精简环境可用 `uv pip install --no-deps windows-capture`
wgc = ["windows-capture>=2.0.1; sys_platform == 'win32'"]

[project.scripts]
gamepilot-engine = "gamepilot.rpc.stdio:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
packaging = [
  "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/gamepilot/assets" = "gamepilot/assets"

# --------------------------------------------------------------------------- #
# ruff：格式化 + lint（与前端 Prettier/ESLint 对齐的风格基线）
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# 打包临时目录（PyInstaller 构建 venv / 产物）不是源码，别扫
extend-exclude = ["packaging/.build", "packaging/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # 行长交给 formatter
  "RUF001",  # 中文注释里的全角标点
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["gamepilot"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy：src 严格，tests 放宽
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pymobiledevice3.*", "usb.*", "Quartz.*", "AppKit.*", "ApplicationServices.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# adbutils / av / rapidocr / windows-capture 都没有 py.typed：不为第三方缺失的类型信息买单
[[tool.mypy.overrides]]
module = [
  "adbutils",
  "adbutils.*",
  "av",
  "av.*",
  "rapidocr_onnxruntime",
  "rapidocr_onnxruntime.*",
  "windows_capture",
  "windows_capture.*",
]
ignore_missing_imports = true

# torch / ultralytics 是可选依赖（yolo 识别器），开发机上不一定装：不为其类型信息买单
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "ultralytics", "ultralytics.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p no:xonsh`：xonsh（iOS 依赖链带进来的）注册了 pytest 插件，它的 CLI 走 prompt_toolkit，
# 没有 Windows 控制台时直接 INTERNALERROR 把整个 pytest 打死。这个插件对本仓库没有任何用处。
addopts = "-q --strict-markers -p no:xonsh"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["gamepilot"]
